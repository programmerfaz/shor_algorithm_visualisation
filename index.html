<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shor’s Algorithm · Finding the Period · Fazil Mohammad Shahbaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=28" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <img src="uob-logo.png" alt="University of Bahrain" />
      <div class="brand-text">
        <strong>Shor’s Algorithm</strong>
        <span>ITCS 411 · Fazil Mohammad Shahbaz</span>
      </div>
    </div>
    <div class="hero-inline">
      <h1 id="headline">Factoring by finding a period</h1>
      <p id="subhead">RSA hides two primes inside N. Shor builds a repeating list and reads the loop length.</p>
    </div>
    <div class="top-actions">
      <button type="button" id="full-btn">Fullscreen</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="rail">
      <label class="rail-label">Example</label>
      <div id="examples" class="examples"></div>

      <div class="facts" id="facts">
        <div><span>N</span><strong id="fact-n">15</strong></div>
        <div><span>helper a</span><strong id="fact-a">2</strong></div>
        <div><span>period r</span><strong id="fact-r">—</strong></div>
        <div><span>factors</span><strong id="fact-pq">—</strong></div>
      </div>

      <div class="narration-panel" id="narration-panel">
        <p class="step-tag" id="step-tag">Step 1 of 9</p>
        <div id="narration"></div>
      </div>
    </aside>

    <main class="stage">
      <div class="formula-banner" id="formula">A[c] = a<sup>c</sup> mod N</div>
      <div class="array-strip" id="array-strip" aria-live="polite">
        <div class="array-head">
          <span class="array-title">List A</span>
          <span class="array-eq" id="array-eq">A = [ ]</span>
        </div>
        <div class="array-track">
          <span class="array-brace" aria-hidden="true">[</span>
          <div class="array-cells" id="array-cells"></div>
          <span class="array-brace" aria-hidden="true">]</span>
        </div>
      </div>
      <svg id="viz" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Period-finding visualization"></svg>
    </main>
  </div>

  <footer class="controls">
    <button type="button" id="prev" aria-label="Previous step">←</button>
    <button type="button" id="play" class="play" aria-label="Play or pause">Play</button>
    <button type="button" id="next" aria-label="Next step">→</button>
    <div class="track"><div id="progress"></div></div>
    <label class="speed-wrap">
      <span id="speed-label">1×</span>
      <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" />
    </label>
  </footer>

  <script src="app.js?v=28"></script>
</body>
</html>
